build:
    image: build
    environment:
        - PACKAGECLOUD_TOKEN=<TOKEN REMOVED>
        - DRONE_COMMIT_SHORT=$${COMMIT:7}
    commands:
        - git config --global user.email "phenixrizen@gmail.com"
        - git config --global user.name "Phenix Rizen"
        - git tag -a v0.0.1-$DRONE_COMMIT_SHORT -m 'NOVM v0.0.1-$DRONE_COMMIT_SHORT'
        - go version
        - env
        - make deb
        - pkgcld 4 $PACKAGECLOUD_TOKEN rocksolidlabs/novm 
        - sleep 5
        - make push
        # sleep 5 so that packagecloud can update packages meta before deploy
        - sleep 5

notify:
    slack:
        webhook_url: https://hooks.slack.com/services/<KEYS REMOVED>
        channel: build
        username: drone
        on_started: true
        on_success: true
        on_failure: true
